# Secret-free personal defaults. Put credentials in the keychain or environment, never
# in this public repository.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
model_verbosity = "low"

approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

[shell_environment_policy]
# Preserve Codex's automatic exclusion of variable names containing KEY, SECRET, or
# TOKEN instead of forwarding them to child commands by default.
ignore_default_excludes = false

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[agents]
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

[features]
multi_agent = true
prevent_idle_sleep = true
